# macOS theme surfaces for Omarchy Quattro shell.
# Translucent frosted glass menu bar, Spotlight-inspired launcher,
# and refined Apple typography and spacing.

[bar]
background       = "#1c1c1e"
background-alpha = 0.78
text             = "#f5f5f7"
active           = "#ff453a"
scale-with-font  = false
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "#ffffff28"
active-border-foreground = "#ffffff28"

[controls]
normal-color              = "#f5f5f7"
normal-fill-alpha         = 0.06
normal-border             = "#ffffff"
normal-border-width       = 1
normal-border-alpha       = 0.12

hover-cursor-color        = "#ffffff"
hover-cursor-fill-alpha   = 0.14
hover-cursor-border       = "#ffffff"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.22

focus-color               = "#0a84ff"
focus-fill-alpha          = 0.16
focus-border              = "#0a84ff"
focus-border-width        = 1
focus-border-alpha        = 0.40

selected-color            = "#0a84ff"
selected-fill-alpha       = 0.24
selected-border           = "#0a84ff"
selected-border-width     = 1
selected-border-alpha     = 0.45

pressed-fill-alpha        = 0.28
selection-fill-alpha      = 0.35

[spacing]
scale           = 1.0
scale-with-font = true

[font]
base-size  = 12
caption    = 10
body-small = 11
body       = 12
subtitle   = 13
title      = 14
heading    = 16
icon-small = 11
icon       = 14
icon-large = 17

[popups]
background       = "#1c1c1e"
background-alpha = 0.88
text             = "#f5f5f7"
border           = "#ffffff"
border-alpha     = 0.15
border-width     = 1

[tooltip]
background       = "#1c1c1e"
background-alpha = 0.94
text             = "#f5f5f7"
border           = "#ffffff"
border-alpha     = 0.18
border-width     = 1

[notifications]
background       = "#242426"
background-alpha = 0.92
text             = "#f5f5f7"
border           = "#ffffff"
border-alpha     = 0.16
border-width     = 1
countdown        = "#0a84ff"

[launcher]
background                = "#1e1e20"
background-alpha          = 0.88
text                      = "#f5f5f7"
border                    = "#ffffff"
border-alpha              = 0.20
border-width              = 1
scrim                     = "#000000"
scrim-alpha               = 0.35
selected-background       = "#0a84ff"
selected-background-alpha = 0.28
selected-text             = "#ffffff"
selected-border           = "#0a84ff"
selected-border-alpha     = 0.50
selected-border-width     = 1

[menu]
background                = "#1e1e20"
background-alpha          = 0.88
text                      = "#f5f5f7"
border                    = "#ffffff"
border-alpha              = 0.16
border-width              = 1
scrim                     = "#000000"
scrim-alpha               = 0.35
selected-background       = "#0a84ff"
selected-background-alpha = 0.28
selected-text             = "#ffffff"
selected-border           = "#0a84ff"
selected-border-alpha     = 0.50

[polkit]
background       = "#1e1e20"
background-alpha = 0.92
text             = "#f5f5f7"
text-error       = "#ff453a"
border           = "#ffffff"
border-error     = "#ff453a"
border-alpha     = 0.20
scrim            = "#000000"
scrim-alpha      = 0.45
accent           = "#0a84ff"

[lock]
background       = "#1c1c1e"
background-alpha = 0.75
text             = "#ffffff"
placeholder      = "#86868b"
text-error       = "#ff453a"
border           = "#ffffff"
border-active    = "#0a84ff"
border-error     = "#ff453a"
border-alpha     = 0.35
selection        = "#0a84ff"
selection-alpha  = 0.40

[image-picker]
scrim                   = "#000000"
scrim-alpha             = 0.45
text                    = "#f5f5f7"
selected-border         = "#0a84ff"
selected-border-alpha   = 1.0
unselected-border       = "#ffffff"
unselected-border-alpha = 0.20
