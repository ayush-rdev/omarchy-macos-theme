# macOS theme configuration for Alacritty
[window]
opacity = 0.92
blur = true

[cursor]
style = { shape = "Beam", blinking = "On" }

[colors.primary]
background = "#1e1e1e"
foreground = "#f5f5f7"

[colors.cursor]
text = "#1e1e1e"
cursor = "#0a84ff"

[colors.vi_mode_cursor]
text = "#1e1e1e"
cursor = "#0a84ff"

[colors.selection]
text = "#ffffff"
background = "#274b78"

[colors.search.matches]
foreground = "#1e1e1e"
background = "#ffd60a"

[colors.search.focused_match]
foreground = "#1e1e1e"
background = "#ff453a"

[colors.footer_bar]
foreground = "#1e1e1e"
background = "#f5f5f7"

[colors.normal]
black = "#1e1e1e"
red = "#ff453a"
green = "#30d158"
yellow = "#ffd60a"
blue = "#0a84ff"
magenta = "#bf5af2"
cyan = "#64d2ff"
white = "#f5f5f7"

[colors.bright]
black = "#636366"
red = "#ff6961"
green = "#32d74b"
yellow = "#ffe066"
blue = "#409cff"
magenta = "#da8fff"
cyan = "#70d7ff"
white = "#ffffff"

[scrolling]
multiplier = 1
