# macOS theme configuration for Kitty
foreground #f5f5f7
background #1e1e1e
background_opacity 0.92
background_blur 32
selection_foreground #ffffff
selection_background #274b78

# Apple System Blue beam cursor
cursor #0a84ff
cursor_text_color #1e1e1e
cursor_shape beam
cursor_blink_interval 0.5

active_border_color #0a84ff
active_tab_background #0a84ff

# macOS ANSI Colors
color0 #1e1e1e
color1 #ff453a
color2 #30d158
color3 #ffd60a
color4 #0a84ff
color5 #bf5af2
color6 #64d2ff
color7 #f5f5f7
color8 #636366
color9 #ff6961
color10 #32d74b
color11 #ffe066
color12 #409cff
color13 #da8fff
color14 #70d7ff
color15 #ffffff

# Smooth macOS scroll multiplier
wheel_scroll_multiplier 1.0
touch_scroll_multiplier 1.0
